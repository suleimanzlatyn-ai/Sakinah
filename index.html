<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11130f">
<title>Sakinas BBQ Tuala</title>
<style>
html,body{margin:0;min-height:100%;background:#11130f;color:#f6f0e4;font:16px system-ui,sans-serif}
body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{max-width:560px;text-align:center}h1{font:500 clamp(36px,8vw,64px)/1 Georgia,serif;color:#f0cf8a}
p{color:#c9c5b8;line-height:1.7}.spin{width:34px;height:34px;border:3px solid #3b3d31;border-top-color:#d9ad63;border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:#f0cf8a}
</style>
</head>
<body>
<main id="status"><div class="spin"></div><h1>Sakinas BBQ Tuala</h1><p>Preparing the website…</p></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!window.JSZip){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload=resolve;s.onerror=()=>reject(new Error('Could not load the site package reader.'));
        document.head.appendChild(s);
      });
    }
    const response=await fetch('https://raw.githubusercontent.com/suleimanzlatyn-ai/Sakinah/main/sakinas-bbq-premium-demo-v2.zip');
    if(!response.ok)throw new Error('Could not retrieve the website package ('+response.status+').');
    const zip=await JSZip.loadAsync(await response.arrayBuffer());
    let page=zip.file('sakinas-bbq-website/index.html')||zip.file('index.html');
    if(!page){
      const matches=Object.keys(zip.files).filter(n=>n.endsWith('/index.html')&&!zip.files[n].dir);
      if(matches.length)page=zip.file(matches[0]);
    }
    if(!page)throw new Error('The package does not contain an index.html file.');
    const html=await page.async('text');
    document.open();document.write(html);document.close();
  }catch(error){
    status.innerHTML='<h1>We are preparing something delicious.</h1><p>The website could not load its files just now.</p><p>'+String(error.message||error).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</p><p>Please refresh in a moment, or contact the website owner.</p>';
  }
})();
</script>
</body>
</html>
